openapi: 3.0.3
info:
  title: Menu Service API
  description: >
    Good Food 3.0 — per-restaurant menus. Each menu item belongs to one
    restaurant (tenant). Customers browse a restaurant's menu publicly;
    a franchisee manages only their own restaurant's menu (JWT tenant_id).
  version: 0.1.0
servers:
  - url: http://localhost:8085
tags:
  - name: Menu
  - name: Recipes
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MenuItemInput:
      type: object
      required: [name, price_cents, category]
      properties:
        name: { type: string }
        description: { type: string }
        price_cents: { type: integer, minimum: 1 }
        category: { type: string, example: Burgers }
        emoji: { type: string, example: 🍔 }
        available: { type: boolean, default: true }
    MenuItem:
      allOf:
        - $ref: '#/components/schemas/MenuItemInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            restaurant_id: { type: string, format: uuid }
            rating: { type: number }
    RecipeLine:
      type: object
      required: [stock_item_id, quantity]
      properties:
        stock_item_id: { type: string, format: uuid }
        stock_item_name: { type: string, example: Farine }
        unit: { type: string, example: kg }
        quantity: { type: number, minimum: 0.001, maximum: 999999999.999, description: Per dish, rounded to 3 decimals }
    Recipe:
      type: object
      properties:
        menu_item_id: { type: string, format: uuid }
        lines: { type: array, items: { $ref: '#/components/schemas/RecipeLine' } }
    RecipeInput:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          maxItems: 50
          description: No duplicate stock_item_id. An empty array deletes the recipe.
          items: { $ref: '#/components/schemas/RecipeLine' }
paths:
  /api/menu:
    get:
      tags: [Menu]
      summary: Browse a restaurant's menu (public)
      parameters:
        - in: query
          name: restaurantId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Available items of the restaurant
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MenuItem' } }
    post:
      tags: [Menu]
      summary: Create an item in the manager's own restaurant
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuItemInput' }
      responses:
        '201': { description: Created }
        '403': { description: Not a manager of a restaurant }
  /api/menu/search:
    get:
      tags: [Menu]
      summary: Find a dish in every restaurant serving it (public)
      description: >
        Available dishes whose name or category contains q (case and accents
        ignored), 50 at most, without photo. A dish with an empty restaurant_id
        is global: offered by every restaurant except those in hidden_in.
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
      responses:
        '200':
          description: Matching dishes
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/MenuItem'
                    - type: object
                      properties:
                        hidden_in: { type: array, items: { type: string, format: uuid } }
        '400': { description: q shorter than 2 or longer than 80 characters }
  /api/menu/manage:
    get:
      tags: [Menu]
      summary: List the manager's own restaurant menu (incl. unavailable)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: All items of the manager's restaurant
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MenuItem' } }
  /api/menu/{id}:
    patch:
      tags: [Menu]
      summary: Update an item (own restaurant only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuItemInput' }
      responses:
        '200': { description: Updated }
        '403': { description: Item belongs to another restaurant }
    delete:
      tags: [Menu]
      summary: Delete an item (own restaurant only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '403': { description: Item belongs to another restaurant }
  /api/menu/{id}/recipe:
    get:
      tags: [Recipes]
      summary: Recipe of a dish for the manager's own restaurant (empty lines if none)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The recipe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recipe' }
        '400': { description: Malformed id }
        '403': { description: Not a manager (admin included) or dish of another restaurant }
        '404': { description: Unknown dish }
    put:
      tags: [Recipes]
      summary: Replace the recipe of a dish for the manager's own restaurant
      description: Works on a global dish too (the recipe stays per restaurant). Body limited to 1 MiB.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecipeInput' }
      responses:
        '200':
          description: The saved recipe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recipe' }
        '400': { description: Invalid recipe (quantity <= 0, duplicate item, bad id, more than 50 lines) }
        '403': { description: Not a manager (admin included) or dish of another restaurant }
        '404': { description: Unknown dish }
        '413': { description: Body too large }
